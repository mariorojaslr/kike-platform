<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="aposGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <!-- Fondo Institucional Redondeado -->
  <rect width="240" height="240" rx="44" fill="url(#aposGrad)" />
  <!-- Aro interno sutil -->
  <rect x="10" y="10" width="220" height="220" rx="36" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
  
  <!-- Cruz Médica / Salud Moderna Superior -->
  <g transform="translate(120, 62)">
    <rect x="-10" y="-26" width="20" height="52" rx="6" fill="#38bdf8" opacity="0.95"/>
    <rect x="-26" y="-10" width="52" height="20" rx="6" fill="#10b981" opacity="0.95"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
  </g>

  <!-- Sigla Principal APOS -->
  <text x="120" y="148" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="60" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">APOS</text>
  
  <!-- Línea divisoria institucional -->
  <rect x="45" y="164" width="150" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Subtítulo Obra Social Provincial -->
  <text x="120" y="188" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#e0f2fe" text-anchor="middle" letter-spacing="2.5">OBRA SOCIAL PROVINCIAL</text>
  <text x="120" y="208" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc" text-anchor="middle" letter-spacing="3.5">LA RIOJA</text>
</svg>
